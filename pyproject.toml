[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "speako"
version = "0.1.0"
description = "Windows voice-to-prompt tray utility"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "openai>=1.68",
  "pynput>=1.7.7",
  "python-dotenv>=1.0",
  "PySide6>=6.7",
  "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["speako*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
